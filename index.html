<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل الشروق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', sans-serif; background: #f5f5f5; padding: 20px; }

.topbar {
  background: #0f1e3d;
  color: #fff;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo { font-size: 20px; font-weight: 900; }
.logo span { color: #c9a84c; }
.cart-icon { font-size: 20px; cursor: pointer; position: relative; }

.search-bar {
  margin-bottom: 20px;
}
.search-input {
  width: 100%;
  padding: 12px 15px;
  border-radius: 25px;
  border: 2px solid #ddd;
  font-family: 'Tajawal';
  font-size: 14px;
}

.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 20px;
  padding-bottom: 10px;
}
.cat-btn {
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid #ddd;
  background: #fff;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'Tajawal';
}
.cat-btn.active {
  background: #0f1e3d;
  color: #fff;
  border-color: #0f1e3d;
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 15px;
}

.product-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: transform 0.2s;
  cursor: pointer;
}
.product-card:hover { transform: translateY(-5px); }

.product-img {
  width: 100%;
  height: 120px;
  background: #f0f0f0;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  margin-bottom: 10px;
}

.product-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.product-price { color: #c9a84c; font-weight: 900; font-size: 16px; }

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal.open { display: flex; }
.modal-content {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  max-width: 400px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Tajawal';
  font-weight: 700;
  width: 100%;
  margin-top: 10px;
}
.btn-primary { background: #0f1e3d; color: #fff; }
.btn-gold { background: #c9a84c; color: #fff; }
.btn-wa { background: #25D366; color: #fff; }

.admin-btn {
  background: transparent;
  border: none;
  color: #666;
  cursor: pointer;
  font-size: 14px;
  margin-top: 20px;
  display: block;
  text-align: center;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">دليل <span>الشروق</span></div>
  <div class="cart-icon" onclick="toggleCart()">
    <i class="fa-solid fa-cart-shopping"></i>
    <span id="cartCount" style="background:#c9a84c;border-radius:50%;padding:2px 6px;font-size:10px;position:absolute;top:-8px;right:-8px;">0</span>
  </div>
</div>

<div class="search-bar">
  <input class="search-input" id="searchInput" placeholder="ابحث عن منتج..." oninput="filterProducts()">
</div>

<div class="categories" id="categoriesContainer"></div>

<div class="products-grid" id="productsContainer"></div>

<button class="admin-btn" onclick="openAdmin()"><i class="fa-solid fa-lock"></i> لوحة الإدارة</button>

<!-- Cart Modal -->
<div class="modal" id="cartModal">
  <div class="modal-content">
    <h3 style="margin-bottom:15px;">🛒 سلة المشتريات</h3>
    <div id="cartItems"></div>
    <div id="cartTotal" style="font-weight:900;font-size:18px;margin:10px 0;"></div>
    <button class="btn btn-wa" onclick="checkout()"><i class="fa-brands fa-whatsapp"></i> إتمام الطلب عبر واتساب</button>
    <button class="btn btn-primary" onclick="toggleCart()" style="margin-top:5px;">إغلاق</button>
  </div>
</div>

<!-- Admin Modal -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h3 style="margin-bottom:15px;">🔐 لوحة الإدارة</h3>
    <input class="search-input" id="adminPass" type="password" placeholder="كلمة المرور" style="margin-bottom:10px;">
    <button class="btn btn-primary" onclick="checkAdmin()">دخول</button>
    <button class="btn" onclick="closeAdmin()" style="margin-top:5px;">إلغاء</button>
  </div>
</div>

<!-- Admin Panel Modal -->
<div class="modal" id="adminPanel">
  <div class="modal-content">
    <h3 style="margin-bottom:15px;">⚙️ لوحة التحكم</h3>
    
    <div style="margin-bottom:10px;">
      <input class="search-input" id="newName" placeholder="اسم المنتج">
      <input class="search-input" id="newCode" placeholder="الكود">
      <input class="search-input" id="newPrice" type="number" placeholder="السعر">
      <select class="search-input" id="newCategory"></select>
    </div>
    
    <button class="btn btn-gold" onclick="addProduct()"><i class="fa-solid fa-plus"></i> إضافة منتج</button>
    <button class="btn btn-primary" onclick="closeAdminPanel()" style="margin-top:5px;">إغلاق</button>
  </div>
</div>

<script>
// ========== Firebase Config ==========
const firebaseConfig = {
  apiKey: "AIzaSyCsgMuEv5KkuGwpSgH2usr0cl0_ObOG4-c",
  authDomain: "daleel-shrouk.firebaseapp.com",
  databaseURL: "https://daleel-shrouk-default-rtdb.firebaseio.com",
  projectId: "daleel-shrouk",
  storageBucket: "daleel-shrouk.firebasestorage.app",
  messagingSenderId: "728060422060",
  appId: "1:728060422060:web:dfdd795b291ee9f7b77c09"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ========== Variables ==========
let products = [];
let categories = [];
let cart = [];
let activeCategory = 'الكل';

// ========== Load Data ==========
function loadData() {
  db.ref('products').on('value', snapshot => {
    products = snapshot.val() || [];
    renderProducts();
  });
  
  db.ref('categories').on('value', snapshot => {
    categories = snapshot.val() || ['الكل', 'تقويم', 'أندو', 'جلدز', 'كمبوزيت', 'مستهلكات', 'زراعة', 'تشخيص'];
    renderCategories();
  });
  
  // Load cart from localStorage
  const savedCart = localStorage.getItem('cart');
  if (savedCart) cart = JSON.parse(savedCart);
  updateCartCount();
}

// ========== Render Products ==========
function renderProducts() {
  const container = document.getElementById('productsContainer');
  const search = document.getElementById('searchInput').value.toLowerCase();
  
  const filtered = products.filter(p => {
    const matchCategory = activeCategory === 'الكل' || p.category === activeCategory;
    const matchSearch = p.name.toLowerCase().includes(search) || p.code.toLowerCase().includes(search);
    return matchCategory && matchSearch;
  });
  
  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">لا توجد منتجات</div>';
    return;
  }
  
  container.innerHTML = filtered.map(p => `
    <div class="product-card" onclick="addToCart(${p.id})">
      <div class="product-img">🦷</div>
      <div class="product-name">${p.name}</div>
      <div style="color:#999;font-size:12px;">${p.code}</div>
      <div class="product-price">${Number(p.price).toLocaleString('ar-EG')} جنيه</div>
    </div>
  `).join('');
}

// ========== Render Categories ==========
function renderCategories() {
  const container = document.getElementById('categoriesContainer');
  container.innerHTML = categories.map(c => `
    <button class="cat-btn ${c === activeCategory ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</button>
  `).join('');
}

function selectCategory(cat) {
  activeCategory = cat;
  renderCategories();
  renderProducts();
}

// ========== Search ==========
function filterProducts() {
  renderProducts();
}

// ========== Cart ==========
function addToCart(id) {
  const product = products.find(p => p.id === id);
  if (!product) return;
  
  const existing = cart.find(item => item.id === id);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({...product, qty: 1});
  }
  
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartCount();
  alert(`✅ تمت إضافة ${product.name} إلى السلة`);
}

function updateCartCount() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById('cartCount').textContent = count;
}

function toggleCart() {
  const modal = document.getElementById('cartModal');
  if (modal.classList.contains('open')) {
    modal.classList.remove('open');
  } else {
    renderCart();
    modal.classList.add('open');
  }
}

function renderCart() {
  const container = document.getElementById('cartItems');
  const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  
  if (cart.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">السلة فارغة</div>';
    document.getElementById('cartTotal').textContent = '';
    return;
  }
  
  container.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div>
        <div style="font-weight:700;">${item.name}</div>
        <div style="font-size:12px;color:#999;">${item.code} × ${item.qty}</div>
      </div>
      <div style="font-weight:700;color:#c9a84c;">${Number(item.price * item.qty).toLocaleString('ar-EG')} جنيه</div>
    </div>
  `).join('');
  
  document.getElementById('cartTotal').textContent = `الإجمالي: ${Number(total).toLocaleString('ar-EG')} جنيه`;
}

// ========== Checkout ==========
function checkout() {
  if (cart.length === 0) {
    alert('السلة فارغة');
    return;
  }
  
  const items = cart.map(item => `• ${item.name} (${item.code}) × ${item.qty} = ${Number(item.price * item.qty).toLocaleString('ar-EG')} جنيه`).join('\n');
  const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  
  const msg = `🦷 طلب جديد من دليل الشروق\n\n📦 المنتجات:\n${items}\n\n💰 الإجمالي: ${Number(total).toLocaleString('ar-EG')} جنيه\n\nشكراً لتعاملكم 🙏`;
  
  window.open(`https://wa.me/201224561525?text=${encodeURIComponent(msg)}`, '_blank');
  
  cart = [];
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartCount();
  toggleCart();
}

// ========== Admin ==========
function openAdmin() {
  document.getElementById('adminModal').classList.add('open');
}

function closeAdmin() {
  document.getElementById('adminModal').classList.remove('open');
}

function checkAdmin() {
  const pass = document.getElementById('adminPass').value;
  if (pass === 'belal2026') {
    closeAdmin();
    openAdminPanel();
  } else {
    alert('كلمة المرور غير صحيحة');
  }
}

function openAdminPanel() {
  const modal = document.getElementById('adminPanel');
  const select = document.getElementById('newCategory');
  select.innerHTML = categories.filter(c => c !== 'الكل').map(c => `<option value="${c}">${c}</option>`).join('');
  modal.classList.add('open');
}

function closeAdminPanel() {
  document.getElementById('adminPanel').classList.remove('open');
}

function addProduct() {
  const name = document.getElementById('newName').value;
  const code = document.getElementById('newCode').value;
  const price = parseInt(document.getElementById('newPrice').value);
  const category = document.getElementById('newCategory').value;
  
  if (!name || !code || !price || !category) {
    alert('يرجى ملء جميع الحقول');
    return;
  }
  
  const maxId = products.length > 0 ? Math.max(...products.map(p => p.id)) : 0;
  const newProduct = { id: maxId + 1, name, code, price, category, badge: '' };
  
  db.ref('products').set([...products, newProduct]);
  
  document.getElementById('newName').value = '';
  document.getElementById('newCode').value = '';
  document.getElementById('newPrice').value = '';
  
  alert('✅ تم إضافة المنتج بنجاح');
}

// ========== Start ==========
loadData();
</script>

</body>
</html>
