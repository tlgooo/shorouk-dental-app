<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دليل الشروق – Dr. Bilal Al-Najashi</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --navy: #0f1e3d;
  --navy-light: #2a4a9e;
  --gold: #c9a84c;
  --gold-dark: #a07828;
  --off: #f7f8fc;
  --text: #0f1e3d;
  --text-2: #4a5568;
  --text-3: #94a3b8;
  --border: rgba(15,30,61,0.10);
  --r: 16px;
  --r-sm: 10px;
  --r-xs: 7px;
  --green: #10b981;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', sans-serif; background: var(--off); color: var(--text); min-height: 100vh; overflow-x: hidden; }
#splash { position: fixed; inset: 0; background: linear-gradient(160deg, #0a1428 0%, #0f1e3d 45%, #1a2f5a 100%); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
#splash.out { opacity: 0; pointer-events: none; }
.splash-ring { width: 110px; height: 110px; border-radius: 50%; background: linear-gradient(135deg, #c9a84c22, #c9a84c44); border: 2px solid rgba(201,168,76,0.35); display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
.splash-icon { font-size: 48px; color: var(--gold); }
.splash-name { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 6px; }
.splash-sub { font-size: 14px; color: rgba(201,168,76,0.9); margin-bottom: 48px; }
.topbar { background: linear-gradient(135deg, #0a1428 0%, #0f1e3d 55%, #162d5c 100%); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.logo-area { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--navy); font-weight: 900; }
.logo-text h1 { font-size: 15px; font-weight: 800; color: #fff; }
.logo-text p { font-size: 11px; color: rgba(201,168,76,0.85); }
.topbar-actions { display: flex; gap: 8px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid rgba(201,168,76,0.25); color: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.cart-badge { position: absolute; top: -3px; left: -3px; background: var(--gold); color: var(--navy); font-size: 9px; font-weight: 900; width: 17px; height: 17px; border-radius: 50%; display: none; align-items: center; justify-content: center; }
.search-bar { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 16px; }
.search-inner { max-width: 640px; margin: 0 auto; position: relative; }
.search-input { width: 100%; padding: 11px 44px; border: 1.5px solid var(--border); border-radius: 50px; font-family: 'Tajawal', sans-serif; font-size: 14px; background: var(--off); direction: rtl; }
.cats-bar { background: #fff; border-bottom: 1px solid var(--border); padding: 10px 16px; }
.cats-scroll { display: flex; gap: 7px; overflow-x: auto; }
.cat-chip { white-space: nowrap; padding: 6px 15px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--off); color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; }
.cat-chip.active { background: var(--navy); color: #fff; }
.products-area { padding: 16px; max-width: 960px; margin: 0 auto; }
.sec-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sec-title { font-size: 16px; font-weight: 800; color: var(--navy); }
.sec-cnt { font-size: 13px; color: var(--text-3); background: var(--off); padding: 3px 10px; border-radius: 50px; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.pcard { background: #fff; border-radius: var(--r); border: 1.5px solid var(--border); overflow: hidden; cursor: pointer; }
.pimg { width: 100%; height: 130px; background: linear-gradient(135deg, #eef2ff 0%, #e0e8ff 100%); display: flex; align-items: center; justify-content: center; position: relative; }
.pimg img { width: 100%; height: 100%; object-fit: cover; }
.cat-label { position: absolute; bottom: 7px; right: 7px; background: rgba(15,30,61,0.75); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 50px; }
.pbody { padding: 10px 12px 12px; }
.pname { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.pcode { font-size: 11px; color: var(--text-3); margin-bottom: 7px; }
.pprice { font-size: 16px; font-weight: 900; color: var(--gold-dark); }
.pactions { display: flex; gap: 6px; margin-top: 9px; }
.btn-details { flex: 1; padding: 7px 6px; border: 1.5px solid var(--navy); border-radius: var(--r-xs); background: transparent; color: var(--navy); font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-addcart { width: 32px; height: 32px; border-radius: var(--r-xs); background: var(--gold); border: none; color: var(--navy); font-size: 13px; cursor: pointer; }
.page { display: none; }
.page.active { display: block; }
.overlay { position: fixed; inset: 0; background: rgba(10,20,40,0.65); backdrop-filter: blur(5px); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.sheet { background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 620px; max-height: 88vh; display: flex; flex-direction: column; }
.sheet-hdr { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sheet-title { font-size: 17px; font-weight: 800; color: var(--navy); }
.close-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--off); border: none; cursor: pointer; font-size: 14px; color: var(--text-3); }
.sheet-body { flex: 1; overflow-y: auto; padding: 14px 18px; }
.sheet-foot { padding: 14px 18px; border-top: 1px solid var(--border); }
.citem { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.citem-img { width: 52px; height: 52px; border-radius: var(--r-xs); background: linear-gradient(135deg, #eef2ff, #d5e3ff); display: flex; align-items: center; justify-content: center; font-size: 24px; }
.citem-info { flex: 1; }
.citem-name { font-size: 13px; font-weight: 700; }
.citem-price { font-size: 12px; color: var(--gold-dark); font-weight: 600; }
.qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border); background: #fff; color: var(--navy); font-size: 14px; font-weight: 700; cursor: pointer; }
.qty-n { font-size: 14px; font-weight: 800; min-width: 22px; text-align: center; }
.total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.total-val { font-size: 22px; font-weight: 900; color: var(--gold-dark); }
.btn-checkout { width: 100%; padding: 14px; border: none; border-radius: var(--r); background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
.detail-topbar { background: linear-gradient(135deg, #0a1428, #0f1e3d); padding: 10px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
.back-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.12); border: none; color: #fff; cursor: pointer; font-size: 15px; }
.detail-wrap { max-width: 620px; margin: 0 auto; padding: 16px; }
.detail-img-box { width: 100%; height: 260px; border-radius: var(--r); background: linear-gradient(135deg, #eef2ff, #d5e3ff); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
.detail-card { background: #fff; border-radius: var(--r); border: 1.5px solid var(--border); padding: 20px; margin-bottom: 14px; }
.detail-prod-name { font-size: 22px; font-weight: 900; color: var(--navy); margin-bottom: 14px; }
.drow { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }
.dlabel { font-size: 13px; color: var(--text-3); }
.dval { font-size: 14px; font-weight: 700; }
.dprice-val { font-size: 24px; font-weight: 900; color: var(--gold-dark); }
.detail-btns { display: flex; flex-direction: column; gap: 10px; }
.btn-wa { padding: 14px; border: none; border-radius: var(--r); background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--navy); color: #fff; padding: 11px 22px; border-radius: 50px; font-size: 13px; z-index: 999; transition: transform 0.3s; }
.toast.show { transform: translateX(-50%) translateY(0); }
.admin-overlay.sheet { max-height: 95vh; }
.tab-row { display: flex; border-bottom: 1px solid var(--border); padding: 0 18px; overflow-x: auto; }
.tab-btn { padding: 11px 12px; border: none; background: none; font-size: 13px; font-weight: 700; color: var(--text-3); cursor: pointer; border-bottom: 2.5px solid transparent; white-space: nowrap; }
.tab-btn.on { color: var(--navy); border-color: var(--navy); }
.tab-pane { display: none; }
.tab-pane.on { display: block; }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
.stat-card { background: var(--off); border-radius: var(--r-sm); padding: 14px; text-align: center; }
.stat-num { font-size: 24px; font-weight: 900; color: var(--navy); }
.stat-lbl { font-size: 12px; color: var(--text-3); }
.fi { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: var(--r-xs); font-family: 'Tajawal', sans-serif; font-size: 14px; direction: rtl; }
.btn-save { width: 100%; padding: 13px; border: none; border-radius: var(--r); background: linear-gradient(135deg, var(--navy), var(--navy-light)); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-ring"><i class="fa-solid fa-tooth splash-icon"></i></div>
  <div class="splash-name">دليل الشروق</div>
  <div class="splash-sub">Dr. Bilal Al-Najashi · مستلزمات طب الأسنان</div>
</div>

<div class="topbar">
  <div class="logo-area">
    <div class="logo-icon"><i class="fa-solid fa-tooth"></i></div>
    <div class="logo-text"><h1>دليل الشروق</h1><p>Dr. Bilal Al-Najashi</p></div>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" onclick="openAdmin()"><i class="fa-solid fa-gear"></i></button>
    <button class="icon-btn" onclick="openCart()">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>
</div>

<div id="homePage" class="page active">
  <div class="search-bar">
    <div class="search-inner">
      <input class="search-input" type="text" id="searchInput" placeholder="ابحث بالاسم أو الكود..." oninput="doSearch(this.value)">
    </div>
  </div>
  <div class="cats-bar">
    <div class="cats-scroll" id="catsScroll"></div>
  </div>
  <div class="products-area">
    <div class="sec-hdr">
      <span class="sec-title" id="secTitle">جميع المنتجات</span>
      <span class="sec-cnt" id="secCnt"></span>
    </div>
    <div id="productsContainer"></div>
  </div>
</div>

<div id="detailPage" class="page">
  <div class="detail-topbar">
    <button class="back-btn" onclick="closeDetail()"><i class="fa-solid fa-arrow-right"></i></button>
    <span class="detail-topbar-title">تفاصيل المنتج</span>
  </div>
  <div class="detail-wrap" id="detailWrap"></div>
</div>

<div class="overlay" id="cartOverlay">
  <div class="sheet">
    <div class="sheet-hdr">
      <span class="sheet-title">سلة المشتريات</span>
      <button class="close-btn" onclick="closeCart()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="sheet-body" id="cartBody"></div>
    <div class="sheet-foot">
      <div class="total-row">
        <span class="total-lbl">الإجمالي:</span>
        <span class="total-val" id="cartTotal">0 جنيه</span>
      </div>
      <button class="btn-checkout" onclick="checkout()"><i class="fa-brands fa-whatsapp"></i> إتمام الطلب عبر واتساب</button>
    </div>
  </div>
</div>

<div class="overlay admin-overlay" id="adminOverlay">
  <div class="sheet">
    <div class="sheet-hdr">
      <span class="sheet-title">لوحة التحكم</span>
      <button class="close-btn" onclick="closeAdmin()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="tab-row">
      <button class="tab-btn on" onclick="switchTab(0)">الإحصائيات</button>
      <button class="tab-btn" onclick="switchTab(1)">المنتجات</button>
      <button class="tab-btn" onclick="switchTab(2)">إضافة منتج</button>
    </div>
    <div class="sheet-body">
      <div class="tab-pane on" id="tab0">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-num" id="statProds">0</div><div class="stat-lbl">المنتجات</div></div>
          <div class="stat-card"><div class="stat-num" id="statCats">0</div><div class="stat-lbl">التصنيفات</div></div>
        </div>
        <p style="font-size:13px;color:var(--text-3)">لإدارة المنتجات اذهب لتبويب "المنتجات"</p>
      </div>
      <div class="tab-pane" id="tab1">
        <div id="adminProdsList"></div>
      </div>
      <div class="tab-pane" id="tab2">
        <div style="margin-bottom:14px">
          <label style="font-size:13px;font-weight:700">اسم المنتج</label>
          <input class="fi" id="adminName" placeholder="اسم المنتج">
        </div>
        <div style="margin-bottom:14px">
          <label style="font-size:13px;font-weight:700">الكود</label>
          <input class="fi" id="adminCode" placeholder="ORTH-001">
        </div>
        <div style="margin-bottom:14px">
          <label style="font-size:13px;font-weight:700">السعر</label>
          <input class="fi" id="adminPrice" type="number" placeholder="1850">
        </div>
        <div style="margin-bottom:14px">
          <label style="font-size:13px;font-weight:700">التصنيف</label>
          <select class="fi" id="adminCat"></select>
        </div>
        <button class="btn-save" onclick="saveProd()">حفظ المنتج</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WANUM = '201224561525';

const DEFAULT_CATS = ['الكل','تقويم','أندو','جلدز','كمبوزيت','مستهلكات','زراعة','تشخيص'];
const DEFAULT_PRODS = [
  {id:1,name:'كيت تقويم سيراميكي كامل',code:'ORTH-001',price:1850,category:'تقويم'},
  {id:2,name:'أسلاك نيتي تقويم 0.016',code:'ORTH-002',price:320,category:'تقويم'},
  {id:3,name:'براكيت ميتال MBT 022',code:'ORTH-003',price:750,category:'تقويم'},
  {id:4,name:'فايلات ProTaper Gold',code:'ENDO-001',price:980,category:'أندو'},
  {id:5,name:'كمبوزيت روبي سيرام A2',code:'COMP-001',price:650,category:'كمبوزيت'},
];

let prods = [], cats = [], cart = [];
let activeCat = 'الكل', query = '';
let currentProd = null, editId = null;

async function init() {
  try {
    const res = await fetch('products.json?v=' + Date.now());
    const data = await res.json();
    prods = data.map(p=>({...p, image: p.image || null}));
    console.log('تم تحميل', prods.length, 'منتج من GitHub');
  } catch(e) {
    const sp = localStorage.getItem('ds_prods');
    prods = sp? JSON.parse(sp) : DEFAULT_PRODS.map(p=>({...p,image:null}));
  }

  const sc = localStorage.getItem('ds_cats');
  cats = sc? JSON.parse(sc) : [...DEFAULT_CATS];
  const sc2 = localStorage.getItem('ds_cart');
  cart = sc2? JSON.parse(sc2) : [];

  renderCats(); renderProds(); updateBadge();

  setTimeout(() => {
    document.getElementById('splash').classList.add('out');
  }, 1500);
}

function saveProd() { localStorage.setItem('ds_prods', JSON.stringify(prods)); }
function saveCats() { localStorage.setItem('ds_cats', JSON.stringify(cats)); }
function saveCart() { localStorage.setItem('ds_cart', JSON.stringify(cart)); }

function renderCats() {
  document.getElementById('catsScroll').innerHTML = cats.map(c =>
    `<button class="cat-chip ${c===activeCat?'active':''}" onclick="selCat('${c}')">${c}</button>`
  ).join('');
}
function selCat(c) { activeCat=c; renderCats(); renderProds(); }

function doSearch(v) {
  query = v.trim();
  renderProds();
}

function getFiltered() {
  return prods.filter(p => {
    const mc = activeCat==='الكل' || p.category===activeCat;
    const ms =!query || p.name.toLowerCase().includes(query.toLowerCase()) || p.code.toLowerCase().includes(query.toLowerCase());
    return mc && ms;
  });
}

function renderProds() {
  const f = getFiltered();
  const container = document.getElementById('productsContainer');
  document.getElementById('secTitle').textContent = activeCat==='الكل'? 'جميع المنتجات' : activeCat;
  document.getElementById('secCnt').textContent = `${f.length} منتج`;

  if(f.length===0) {
    container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-box-open"></i><h3>لا توجد منتجات</h3></div>`;
    return;
  }

  container.innerHTML = `<div class="products-grid">${f.map(p => `
    <div class="pcard">
      <div class="pimg" onclick="openDetail(${p.id})">
        <div style="font-size:48px">📦</div>
        <span class="cat-label">${p.category}</span>
      </div>
      <div class="pbody">
        <div class="pname">${p.name}</div>
        <div class="pcode">${p.code}</div>
        <div class="pprice">${Number(p.price).toLocaleString('ar-EG')} جنيه</div>
        <div class="pactions">
          <button class="btn-details" onclick="openDetail(${p.id})">التفاصيل</button>
          <button class="btn-addcart" onclick="addToCart(${p.id})"><i class="fa-solid fa-cart-plus"></i></button>
        </div>
      </div>
    </div>
  `).join('')}</div>`;
}

function openDetail(id) {
  currentProd = prods.find(p=>p.id===id);
  if(!currentProd) return;
  document.getElementById('homePage').classList.remove('active');
  document.getElementById('detailPage').classList.add('active');
  document.getElementById('detailWrap').innerHTML = `
    <div class="detail-img-box"><div style="font-size:72px">📦</div></div>
    <div class="detail-card">
      <div class="detail-prod-name">${currentProd.name}</div>
      <div class="drow"><span class="dlabel">الكود</span><span class="dval">${currentProd.code}</span></div>
      <div class="drow"><span class="dlabel">التصنيف</span><span class="dval">${currentProd.category}</span></div>
      <div class="drow"><span class="dlabel">السعر</span><span class="dprice-val">${Number(currentProd.price).toLocaleString('ar-EG')} جنيه</span></div>
    </div>
    <div class="detail-btns">
      <button class="btn-wa" onclick="orderWA()"><i class="fa-brands fa-whatsapp"></i> اطلب عبر واتساب</button>
      <button class="btn-save" onclick="addToCart(${currentProd.id}); closeDetail()">أضف للسلة</button>
    </div>
  `;
}

function closeDetail() {
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('homePage').classList.add('active');
}

function orderWA() {
  if(!currentProd) return;
  const msg = encodeURIComponent(`مرحبا دكتور بلال\nأرغب في طلب المنتج التالي:\n${currentProd.name}\nالكود: ${currentProd.code}\nالسعر: ${currentProd.price} جنيه`);
  window.open(`https://wa.me/${WANUM}?text=${msg}`, '_blank');
}

function addToCart(id) {
  const p = prods.find(x=>x.id===id);
  if(!p) return;
  const ex = cart.find(c=>c.id===id);
  if(ex) ex.qty++; else cart.push({id,name:p.name,code:p.code,price:p.price,qty:1});
  saveCart(); updateBadge();
  toast(`تمت إضافة ${p.name}`);
}

function updateBadge() {
  const t = cart.reduce((s,c)=>s+c.qty,0);
  const el = document.getElementById('cartBadge');
  el.textContent = t; el.style.display = t>0?'flex':'none';
}

function openCart() {
  document.getElementById('cartOverlay').classList.add('open');
  renderCart();
}
function closeCart() {
  document.getElementById('cartOverlay').classList.remove('open');
}

function renderCart() {
  const body = document.getElementById('cartBody');
  if(cart.length===0) {
    body.innerHTML = `<div class="empty-state"><i class="fa-solid fa-cart-shopping"></i><p>السلة فارغة</p></div>`;
    document.getElementById('cartTotal').textContent = '0 جنيه';
    return;
  }
  body.innerHTML = cart.map((c,i) => `
    <div class="citem">
      <div class="citem-img">📦</div>
      <div class="citem-info">
        <div class="citem-name">${c.name}</div>
        <div class="citem-price">${Number(c.price).toLocaleString('ar-EG')} جنيه</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty(${i},-1)">-</button>
        <span class="qty-n">${c.qty}</span>
        <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
      </div>
    </div>
  `).join('');
  const total = cart.reduce((s,c)=>s+c.price*c.qty,0);
  document.getElementById('cartTotal').textContent = total.toLocaleString('ar-EG') + ' جنيه';
}

function changeQty(i,delta) {
  cart[i].qty += delta;
  if(cart[i].qty<1) cart.splice(i,1);
  saveCart(); renderCart(); updateBadge();
}

function checkout() {
  if(cart.length===0) return;
  let msg = 'مرحبا دكتور بلال\nأرغب في طلب المنتجات التالية:\n\n';
  cart.forEach(c => {
    msg += `- ${c.name} x${c.qty} = ${c.price*c.qty} جنيه\n`;
  });
  const total = cart.reduce((s,c)=>s+c.price*c.qty,0);
  msg += `\nالإجمالي: ${total} جنيه`;
  window.open(`https://wa.me/${WANUM}?text=${encodeURIComponent(msg)}`, '_blank');
}

function openAdmin() {
  document.getElementById('adminOverlay').classList.add('open');
  renderAdminStats();
  renderAdminProds();
  fillAdminCats();
}
function closeAdmin() {
  document.getElementById('adminOverlay').classList.remove('open');
}

function switchTab(n) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('on',i===n));
  document.querySelectorAll('.tab-pane').forEach((p,i)=>p.classList.toggle('on',i===n));
}

function renderAdminStats() {
  document.getElementById('statProds').textContent = prods.length;
  document.getElementById('statCats').textContent = cats.length-1;
}

function renderAdminProds() {
  const list = document.getElementById('adminProdsList');
  list.innerHTML = prods.map(p => `
    <div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:44px;height:44px;border-radius:7px;background:linear-gradient(135deg,#eef2ff,#d5e3ff);display:flex;align-items:center;justify-content:center;font-size:20px">📦</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700">${p.name}</div>
        <div style="font-size:11px;color:var(--text-3)">${p.code} · ${p.category}</div>
      </div>
      <button style="width:30px;height:30px;border-radius:7px;background:rgba(220,53,69,0.08);border:none;color:#dc3545;cursor:pointer" onclick="delProd(${p.id})"><i class="fa-solid fa-trash"></i></button>
    </div>
  `).join('');
}

function delProd(id) {
  if(confirm('حذف المنتج؟')) {
    prods = prods.filter(p=>p.id!==id);
    saveProd();
    renderAdminProds();
    renderProds();
    renderAdminStats();
  }
}

function fillAdminCats() {
  document.getElementById('adminCat').innerHTML = cats.filter(c=>c!=='الكل').map(c=>`<option>${c}</option>`).join('');
}

function saveProd() {
  const name = document.getElementById('adminName').value.trim();
  const code = document.getElementById('adminCode').value.trim();
  const price = parseFloat(document.getElementById('adminPrice').value);
  const category = document.getElementById('adminCat').value;

  if(!name ||!code ||!price) {
    alert('اكمل البيانات');
    return;
  }

  const newId = Math.max(0,...prods.map(p=>p.id))+1;
  prods.push({id:newId,name,code,price,category});
  saveProd();

  document.getElementById('adminName').value = '';
  document.getElementById('adminCode').value = '';
  document.getElementById('adminPrice').value = '';

  renderAdminProds();
  renderProds();
  renderAdminStats();
  switchTab(1);
  toast('تم حفظ المنتج');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
